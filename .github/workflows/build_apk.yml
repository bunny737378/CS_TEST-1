name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: "build-apk"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Inspect files and grant execute permission
        run: |
          echo "=== Repository root files ==="
          ls -la
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found in root, searching subdirectories..."
            GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" -not -path "*/.*" | head -n 1)
            if [ -n "$GRADLEW_PATH" ]; then
              SUBDIR=$(dirname "$GRADLEW_PATH")
              echo "Found gradlew in $SUBDIR. Moving files to repository root..."
              cp -r "$SUBDIR"/* . 2>/dev/null || true
            fi
          fi
          if [ ! -f "gradlew" ]; then
            echo "::error::gradlew not found! Your repository does not contain the project files yet. Please make sure to push the full project from AI Studio (Settings > Push to GitHub) into this repository."
            exit 1
          fi
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
