name: Build APK

on:
  push:
    branches:
      - master
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          # compileSdk is 37. The runner images already ship an API 37 platform and
          # build-tools 37.0.0, but the exact package id varies (platforms;android-37
          # vs platforms;android-37.0), so install each candidate best-effort. Never
          # abort the job here: a hard failure in this step kills the build before
          # Gradle writes anything the diagnostics step can read.
          for pkg in "platforms;android-37" "platforms;android-37.0" "build-tools;37.0.0" \
                     "platforms;android-36" "build-tools;36.0.0" "platform-tools"; do
            if "$SDKMANAGER" --install "$pkg" > /dev/null 2>&1; then
              echo "sdk: installed $pkg"
            else
              echo "sdk: skipped $pkg (unavailable under that id, or already present)"
            fi
          done

          # Record what is actually on disk so the diagnostics step can report it.
          {
            echo "== \$ANDROID_HOME/platforms =="
            ls -1 "$SDK_ROOT/platforms" 2>&1
            echo "== \$ANDROID_HOME/build-tools =="
            ls -1 "$SDK_ROOT/build-tools" 2>&1
          } | tee sdk-diagnostics.log

      - name: Verify fixed debug keystore
        run: |
          test -f debug.keystore
          keytool -list -v \
            -keystore debug.keystore \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Release APK
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --stacktrace --console=plain 2>&1 | tee gradle-build.log
          build_status=${PIPESTATUS[0]}
          exit "$build_status"

      - name: Annotate Gradle build diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          log_path = Path("gradle-build.log")
          lines = log_path.read_text(errors="replace").splitlines() if log_path.exists() else []

          # Surface the SDK inventory too: when the job dies before Gradle runs,
          # gradle-build.log is empty and this is the only useful signal.
          sdk_path = Path("sdk-diagnostics.log")
          if sdk_path.exists():
              lines = sdk_path.read_text(errors="replace").splitlines() + lines

          keep = set()
          diag = re.compile(
              r"(error|aapt|\.xml:|\.kt:|\.kts:|failed linking|not found|more than one time|"
              r"duplicate|Execution failed for task|What went wrong|Caused by:|^e: |^w: |"
              r"FAILURE:|BUILD FAILED|Resource and asset merger|unresolved reference)",
              re.IGNORECASE,
          )

          # Keep every diagnostic line plus generous context. AAPT2 prints the concrete
          # "<file>:<line>: AAPT: error: ..." message immediately *before* the generic
          # "error: failed linking file resources." summary line, so context matters.
          for i, line in enumerate(lines):
              if diag.search(line):
                  keep.update(range(max(0, i - 12), min(len(lines), i + 6)))

          # Keep the whole Gradle failure summary block.
          start = next(
              (i for i, l in enumerate(lines) if l.startswith("FAILURE:") or "What went wrong" in l),
              None,
          )
          if start is not None:
              keep.update(range(start, min(len(lines), start + 300)))

          # Keep the tail as a last resort.
          keep.update(i for i, l in enumerate(lines) if l.strip())

          selected = [lines[i] for i in sorted(keep)][-400:]
          if not selected:
              selected = ["(gradle-build.log was empty or missing)"]

          # Emit as a few chunked annotations so the full text survives through the API.
          chunks, buf, size = [], [], 0
          for line in selected:
              if size + len(line) + 1 > 3500 and buf:
                  chunks.append("\n".join(buf))
                  buf, size = [], 0
              buf.append(line)
              size += len(line) + 1
          if buf:
              chunks.append("\n".join(buf))
          chunks = chunks[-14:]

          for n, chunk in enumerate(chunks, 1):
              escaped = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Build log {n}/{len(chunks)}::{escaped}")
          PY

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
